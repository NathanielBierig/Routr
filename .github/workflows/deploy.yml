name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Mapbox token (from repo secret, never committed)
        # `tr -d` strips any embedded newline/carriage-return from the
        # secret's stored value before it lands inside the JS string
        # literal - a secret pasted with a trailing newline (easy to do
        # by accident) otherwise breaks the string across two lines,
        # producing a "Unexpected EOF" syntax error that aborts the
        # entire script before the map ever initializes.
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$MAPBOX_TOKEN" | tr -d '\n\r')
          echo "const MAPBOX_TOKEN = \"$CLEAN_TOKEN\";" > tokens.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
