name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Mapbox token (from repo secret, never committed)
        # `tr -d` strips embedded newlines/carriage-returns AND literal
        # quote characters from the secret's stored value before it lands
        # inside the JS string literal below. The MAPBOX_TOKEN secret was
        # apparently saved with a trailing newline AND literal surrounding
        # quotes (e.g. from copy-pasting `"pk...";` including the quote
        # marks, rather than just the bare token) - either one breaks the
        # generated string literal (a raw newline splits it across two
        # lines; embedded quotes prematurely close/reopen it), producing a
        # syntax error that aborts the entire script before the map ever
        # initializes. Using `env:` here (rather than interpolating the
        # secret directly into the run command's text) also avoids a shell
        # injection risk: a secret value containing shell metacharacters
        # would otherwise be spliced directly into the command line.
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$MAPBOX_TOKEN" | tr -d "\n\r'\"")
          echo "const MAPBOX_TOKEN = \"$CLEAN_TOKEN\";" > tokens.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
