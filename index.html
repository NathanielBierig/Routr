<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Routr</title>

    <!-- iOS "Add to Home Screen": with these, launching from the home
         screen icon opens full-screen (no Safari chrome) using this icon,
         instead of a plain bookmark that opens back in the browser. -->
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Routr">
    <meta name="theme-color" content="#0f0f15">

    <link rel="stylesheet" href="style.css">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
</head>

<body>

    <div id="hud">
        <div id="hudToggle">
            <span id="hudSummary">Distance: 0 km</span>
            <span class="chevron">▲</span>
        </div>
        <div id="stats">
            <div id="distance">Distance: 0 km</div>
            <div id="walkingTime">Walking: 0 min</div>
            <div id="runningTime">Running: 0 min</div>
            <div id="pace">Pace: 0 min/km</div>
        </div>
        <div id="controls">
            <input type="search" id="searchInput" placeholder="Search place..." enterkeyhint="search">
            <label>
                <span id="paceLabel">Running Pace (min/km):</span>
                <input type="number" id="paceInput" value="5" min="1" max="20" step="0.1">
            </label>
            <button id="toggleUnitsBtn">Units: km</button>
            <button id="toggleFollowRoads">Follow Roads: ON</button>
            <button id="toggleFreehandBtn">Freehand Draw: OFF</button>
            <button id="moreMenuBtn">More ▾</button>
        </div>
    </div>

    <div id="moreMenuPanel" class="hidden">
        <div id="moreMenuHeader">
            <h2>More</h2>
            <button id="closeMoreMenuBtn">×</button>
        </div>
        <div id="moreMenuBody">
            <button id="addCurrentLocationBtn">📍 Add Current Location</button>
            <button id="reorderBtn">Reorder Points</button>
            <button id="directionsBtn">🧭 Directions</button>
            <button id="myRoutesBtn">💾 My Routes</button>
            <button id="undoBtn">Undo</button>
            <button id="clearBtn">Clear</button>
            <button id="closeLoopBtn">Close Loop</button>
        </div>
    </div>

    <div id="reorderPanel" class="hidden">
        <div id="reorderHeader">
            <h2>Waypoints</h2>
            <button id="closeReorderBtn">×</button>
        </div>
        <div id="reorderList"></div>
    </div>

    <div id="directionsPanel" class="hidden">
        <div id="directionsHeader">
            <h2>Directions</h2>
            <button id="closeDirectionsBtn">×</button>
        </div>
        <div id="directionsList"></div>
    </div>

    <div id="myRoutesPanel" class="hidden">
        <div id="myRoutesHeader">
            <h2>My Routes</h2>
            <button id="myRoutesCloseBtn">×</button>
        </div>
        <div id="myRoutesBody">
            <div id="saveRouteSection">
                <label>
                    <span>Save current route as:</span>
                    <input type="text" id="saveRouteName" placeholder="e.g. Morning 5k loop" maxlength="60">
                </label>
                <button id="saveRouteConfirmBtn">Save Route</button>
            </div>
            <div id="myRoutesList"></div>
        </div>
    </div>

    <div id="helpOverlay" class="help-overlay">
        <div class="help-text">👇 Click on the map to start drawing your route</div>
    </div>

    <div id="map"></div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
    <script src="tokens.js"></script>
    <script src="script.js"></script>
</body>
</html>
