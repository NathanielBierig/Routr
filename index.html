<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Draw Route</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
</head>

<body>

    <div id="hud">
        <div id="stats">
            <div id="distance">Distance: 0 km</div>
            <div id="walkingTime">Walking: 0 min</div>
            <div id="runningTime">Running: 0 min</div>
            <div id="pace">Pace: 0 min/km</div>
        </div>
        <div id="controls">
            <label>
                Running Pace (min/km):
                <input type="number" id="paceInput" value="5" min="1" max="20" step="0.1">
            </label>
            <button id="toggleDrawMode">Drawing Mode: ON</button>
            <button id="toggleFollowRoads">Follow Roads: ON</button>
            <button id="undoBtn">Undo</button>
            <button id="clearBtn">Clear</button>
            <button id="closeLoopBtn">Close Loop</button>
        </div>
    </div>

    
    <div id="map"></div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
    <script src="tokens.js"></script>
    <script src="script.js"></script>
</body>
</html>
