<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
    <defs>
        <radialGradient id="bg" cx="50%" cy="38%" r="75%">
            <stop offset="0%" stop-color="#1c1c2e"/>
            <stop offset="100%" stop-color="#0a0a12"/>
        </radialGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="1.6" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="100" height="100" fill="url(#bg)"/>

    <!-- faint street grid, dark map backdrop -->
    <g stroke="#3a3a55" stroke-width="0.4" opacity="0.35">
        <line x1="0" y1="18" x2="100" y2="14"/>
        <line x1="0" y1="52" x2="100" y2="58"/>
        <line x1="0" y1="86" x2="100" y2="82"/>
        <line x1="14" y1="0" x2="10" y2="100"/>
        <line x1="46" y1="0" x2="50" y2="100"/>
        <line x1="82" y1="0" x2="86" y2="100"/>
    </g>
    <g stroke="#3a3a55" stroke-width="0.25" opacity="0.2">
        <line x1="0" y1="35" x2="100" y2="32"/>
        <line x1="0" y1="70" x2="100" y2="74"/>
        <line x1="28" y1="0" x2="24" y2="100"/>
        <line x1="66" y1="0" x2="70" y2="100"/>
    </g>

    <!-- neon "R", drawn as route-style polyline segments with waypoint dots,
         same visual language as the app's own routes -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <!-- stem -->
        <polyline points="34,78 34,22" stroke="#00ff88" stroke-width="7" opacity="0.35"/>
        <polyline points="34,78 34,22" stroke="#00ff88" stroke-width="3"/>

        <!-- bowl -->
        <polyline points="34,22 58,22 64,29 64,42 58,49 34,49" stroke="#3A86FF" stroke-width="7" opacity="0.35"/>
        <polyline points="34,22 58,22 64,29 64,42 58,49 34,49" stroke="#3A86FF" stroke-width="3"/>

        <!-- leg -->
        <polyline points="47,49 66,78" stroke="#FF006E" stroke-width="7" opacity="0.35"/>
        <polyline points="47,49 66,78" stroke="#FF006E" stroke-width="3"/>
    </g>

    <!-- waypoint dot markers at each vertex -->
    <g filter="url(#dotGlow)">
        <circle cx="34" cy="78" r="3.4" fill="#00ff88" stroke="white" stroke-width="1"/>
        <circle cx="34" cy="22" r="3.4" fill="#00ff88" stroke="white" stroke-width="1"/>
        <circle cx="58" cy="22" r="3" fill="#3A86FF" stroke="white" stroke-width="1"/>
        <circle cx="64" cy="29" r="3" fill="#3A86FF" stroke="white" stroke-width="1"/>
        <circle cx="64" cy="42" r="3" fill="#3A86FF" stroke="white" stroke-width="1"/>
        <circle cx="58" cy="49" r="3" fill="#3A86FF" stroke="white" stroke-width="1"/>
        <circle cx="47" cy="49" r="3" fill="#FF006E" stroke="white" stroke-width="1"/>
        <circle cx="66" cy="78" r="3.6" fill="#FF006E" stroke="white" stroke-width="1"/>
    </g>
</svg>
